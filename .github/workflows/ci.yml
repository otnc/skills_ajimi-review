name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: Run checks and verify skill discovery
        shell: bash
        env:
          NO_COLOR: '1'
        run: |
          npm run check | tee "$RUNNER_TEMP/ajimi-review-check.log"
          grep -Eq '[[:space:]]ajimi-review$' "$RUNNER_TEMP/ajimi-review-check.log"
